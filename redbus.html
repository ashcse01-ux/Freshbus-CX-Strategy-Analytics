<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshBus | Redbus Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <style>
  
  /* ─────────────────────────────────────────────────
     VARIABLES & RESET
  ──────────────────────────────────────────────────── */
  :root {
    --blue:#1A73E8; --blue-d:#1557b0; --blue-soft:rgba(26,115,232,.15);
    --yellow:#FBBC04; --yellow-soft:rgba(251,188,4,.15);
    --green:#16a34a; --green-soft:rgba(22,163,74,.15);
    --red:#dc2626; --red-soft:rgba(220,38,38,.15);
    --amber:#d97706; --amber-soft:rgba(217,119,6,.15);
    --purple:#7c3aed; --purple-soft:rgba(124,58,237,.15);

    /* Liquid Glass Theme Colors */
    --bg-gradient: radial-gradient(circle at 15% 50%, rgba(26, 115, 232, 0.2) 0%, transparent 50%),
                   radial-gradient(circle at 85% 30%, rgba(251, 188, 4, 0.2) 0%, transparent 50%),
                   linear-gradient(135deg, #f0f4fa 0%, #e2eafc 100%);
    --surface: rgba(255, 255, 255, 0.6);
    --surface-solid: #ffffff;
    --surface2: rgba(255, 255, 255, 0.4);
    --border: rgba(255, 255, 255, 0.7);
    --border-focus: var(--blue);
    --text: #0f1d35; --text2: #374151; --text-m: #4b5563;

    --sidebar: rgba(255, 255, 255, 0.45);
    --sidebar-text: #0f1d35;
    
    --glass-blur: blur(20px);
    --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);

    --sidebar-w:258px;
    --hdr-h:64px;
    --r:16px; --r-sm:10px;
    --shadow: var(--glass-shadow);
    --shadow-md: 0 12px 40px rgba(26,115,232,.15);
    --shadow-blue: 0 4px 20px rgba(251,188,4,.3);
    --tr:.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  [data-theme="dark"] {
    --bg-gradient: radial-gradient(circle at 15% 50%, rgba(26, 115, 232, 0.25) 0%, transparent 50%),
                   radial-gradient(circle at 85% 30%, rgba(251, 188, 4, 0.15) 0%, transparent 50%),
                   linear-gradient(135deg, #0a0f1e 0%, #111927 100%);
    --surface: rgba(17, 25, 39, 0.6);
    --surface-solid: #111927;
    --surface2: rgba(26, 36, 54, 0.4);
    --border: rgba(255, 255, 255, 0.1);
    --text: #f1f5f9; --text2: #cbd5e1; --text-m: #94a3b8;
    --sidebar: rgba(17, 25, 39, 0.6);
    --sidebar-text: #f1f5f9;
    --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:var(--bg-gradient);background-attachment:fixed;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ─── HEADER ─── */
  .hdr {
    height: 72px; background: #0c4dc3; /* Solid premium blue matching FreshBus logo */
    display:flex; align-items:center; padding:0 1.5rem; gap:1rem; flex-shrink:0; z-index:100;
    box-shadow: 0 4px 15px rgba(12,77,195,0.25); border-bottom: none;
  }
  .hdr-logo { display:flex; align-items:center; gap:12px; text-decoration:none; flex-shrink:0; }
  .hdr-lm {
    width:36px; height:36px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
  }
  .hdr-lm svg { width:100%; height:100%; }
  
  .hdr-brand-wrap { display: flex; flex-direction: column; justify-content: center; margin-top:-2px; }
  .hdr-ln { font-family:'Plus Jakarta Sans',sans-serif; font-size:1.4rem; font-weight:800; color:#FFEA20; line-height:1.1; letter-spacing:-0.03em; }
  .hdr-sub { font-size:0.68rem; font-weight:600; color:rgba(255,255,255,0.65); letter-spacing:0.06em; text-transform:uppercase; margin-top:2px; }

  .hdr-sep { width:1px; height:28px; background:rgba(255,255,255,0.15); flex-shrink:0; margin: 0 5px; }
  
  .hdr-fill { flex:1; }
  
  .hdr-datewrap {
    display:flex; align-items:center; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15);
    border-radius:8px; padding:0 12px; height:38px; gap:8px; font-size:0.85rem; font-weight:600; color:#fff;
  }
  .hdr-datewrap svg { width:14px; color:rgba(255,255,255,0.7); flex-shrink:0; }
  .hdr-datewrap input {
    background:none; border:none; outline:none; color:#fff; font-family:inherit;
    font-size:0.85rem; font-weight:600; width:115px; cursor:pointer;
  }
  .hdr-datewrap input::placeholder { color:rgba(255,255,255,0.6); }
  .hdr-datewrap .sep { color:rgba(255,255,255,0.5); }
  
  .hdr-vbtns {
    display:flex; align-items:center; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); border-radius:8px; padding:4px; gap:4px;
  }
  .hdr-vbtn {
    background:transparent; border:none; padding:5px 14px; border-radius:6px;
    font-size:0.8rem; font-weight:600; color:rgba(255,255,255,0.7); transition:all 0.2s ease;
  }
  .hdr-vbtn:hover { color:#fff; background:rgba(255,255,255,0.1); }
  .hdr-vbtn.active { background:#fff; color:#0c4dc3; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
  
  .hdr-acts { display:flex; gap:6px; }
  .hdr-ibtn {
    width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15);
    display:flex; align-items:center; justify-content:center; color:#fff; transition:all 0.2s ease;
  }
  .hdr-ibtn:hover { background:rgba(255,255,255,0.25); transform:translateY(-1px); }
  .hdr-ibtn svg { width:16px; }
  
  .hdr-user { display:flex; align-items:center; gap:10px; cursor:pointer; padding-left:10px; border-left:1px solid rgba(255,255,255,0.2); }
  .hdr-av { width:36px; height:36px; border-radius:50%; border:2px solid rgba(255,255,255,0.4); overflow:hidden; }
  .hdr-av img { width:100%; height:100%; object-fit:cover; }
  .hdr-un { font-size:0.85rem; font-weight:700; color:#fff; }

  /* ─── APP BODY ─── */
  .app-body { display:flex; flex:1; overflow:hidden; }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width:var(--sidebar-w); background:var(--sidebar); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); flex-shrink:0;
    overflow-y:auto; display:flex; flex-direction:column;
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.08) transparent;
    padding:1.25rem 1rem; gap:0.3rem; border-right:1px solid var(--border);
  }
  .sb-sec { font-size:0.67rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-m); padding:0.8rem 0.75rem 0.35rem; }
  .sb-sync {
    display:flex; align-items:center; gap:8px; background:rgba(22,163,74,.12);
    border:1px solid rgba(22,163,74,.25); border-radius:9px; padding:9px 12px;
    font-size:0.75rem; font-weight:600; color:#4ade80; margin-bottom:0.25rem;
  }
  .sb-dot { width:6px; height:6px; border-radius:50%; background:#4ade80; animation:sbpulse 1.5s ease-in-out infinite; flex-shrink:0; }
  @keyframes sbpulse{0%,100%{opacity:1}50%{opacity:.35}}
  .sb-fg {
    background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:0.75rem;
    display:flex; flex-direction:column; gap:3px; margin-bottom:3px;
  }
  .sb-fg label { font-size:0.7rem; font-weight:600; color:var(--text-m); margin-bottom:2px; }
  .sb-fg select, .sb-fg input[type="text"] {
    width:100%; background:var(--surface); border:1px solid var(--border);
    border-radius:7px; padding:7px 10px; color:var(--text); font-size:0.8rem; font-weight:500;
    outline:none; -webkit-appearance:none; transition:border-color var(--tr);
  }
  .sb-fg select:focus, .sb-fg input:focus { border-color:var(--yellow); }
  .sb-fg select option { background:var(--surface-solid); color:var(--text); }
  .sb-btn {
    width:100%; border:none; border-radius:8px; padding:9px; font-size:0.78rem;
    font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px;
    transition:all var(--tr); margin-top:4px;
  }
  .sb-btn svg { width:13px; }
  .sb-btn-primary { background:var(--blue); color:#fff; }
  .sb-btn-primary:hover { background:var(--blue-d); }
  .sb-btn-warn { background:rgba(220,38,38,.15); color:#f87171; border:1px solid rgba(220,38,38,.25); }
  .sb-btn-warn:hover { background:rgba(220,38,38,.25); }
  .sb-btn-yellow { background:var(--yellow); color:#0f1d35; }
  .sb-btn-yellow:hover { filter:brightness(1.08); }

  /* ─── MAIN ─── */
  .app-main { flex:1; overflow-y:auto; padding:1.75rem 2rem; display:flex; flex-direction:column; gap:1.75rem; }
  .app-main > * { flex-shrink: 0; }

  /* Scrollbar */
  .app-main::-webkit-scrollbar { width:5px; }
  .app-main::-webkit-scrollbar-thumb { background:rgba(0,0,0,.12); border-radius:99px; }
  [data-theme="dark"] .app-main::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); }

  /* ─── PAGE TITLE ─── */
  .pg-head { display:flex; align-items:center; justify-content:space-between; }
  .pg-head h1 { font-family:'Plus Jakarta Sans',sans-serif; font-size:1.55rem; font-weight:800; letter-spacing:-0.03em; }
  .pg-head p { font-size:0.82rem; color:var(--text-m); margin-top:3px; }
  .pg-badge { font-size:0.72rem; font-weight:700; padding:4px 12px; border-radius:100px; background:var(--blue-soft); color:var(--blue); border:1px solid rgba(26,115,232,.2); }

  /* ─── HERO KPI CARDS (Responsive & Sparklines) ─── */
  .hero-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:1.25rem; }
  .hero-card {
    background:var(--surface); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border:1.5px solid var(--border); border-radius:var(--r);
    padding:1.25rem 1.5rem; box-shadow:var(--shadow); position:relative; overflow:hidden;
    transition:box-shadow var(--tr), transform var(--tr);
    display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
  }
  .hero-card:hover { box-shadow:var(--shadow-md); transform:translateY(-2px); }
  .hero-card::after { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:var(--r) var(--r) 0 0; opacity:0; transition:opacity var(--tr); background:var(--accent,var(--blue)); }
  .hero-card:hover::after { opacity:1; }
  .hc-top { display:flex; align-items:flex-start; justify-content:space-between; }
  .hc-lbl { font-size:0.75rem; font-weight:700; color:var(--text-m); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.3rem; }
  .hc-val { font-family:'Plus Jakarta Sans',sans-serif; font-size:2.4rem; font-weight:800; line-height:1; letter-spacing:-0.05em; }
  .hc-val .unit { font-size:1.3rem; font-weight:700; opacity:.6; }
  .hc-sub { font-size:0.74rem; color:var(--text-m); }
  .hc-trend { font-size: 0.72rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-flex; align-items: center; gap: 3px; margin-top: 4px; }
  .hc-trend.up { background: rgba(22,163,74,0.15); color: var(--green); }
  .hc-trend.down { background: rgba(220,38,38,0.15); color: var(--red); }
  .hc-trend.neutral { background: rgba(107,114,128,0.15); color: var(--text-m); }
  .hc-bot { display:flex; align-items:flex-end; justify-content:space-between; gap: 10px; }
  .hc-chart { width: 80px; height: 35px; flex-shrink: 0; }

  /* ─── SEGMENT SWITCHER ─── */
  .seg-bar {
    display:flex; background:var(--surface); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border:1px solid var(--border); border-radius:var(--r);
    padding:5px; gap:4px; box-shadow:var(--shadow);
    overflow-x:auto; flex-wrap:nowrap; scrollbar-width:none; -ms-overflow-style:none;
  }
  .seg-bar::-webkit-scrollbar { display:none; }
  .seg-btn {
    flex:0 0 auto; background:none; border:none; padding:9px 14px; border-radius:var(--r-sm);
    font-size:0.82rem; font-weight:600; color:var(--text-m);
    display:flex; align-items:center; justify-content:center; gap:7px;
    transition:all .2s; white-space:nowrap;
  }
  .seg-btn svg { width:14px; }
  .seg-btn.active { background:var(--blue); color:#fff; box-shadow:var(--shadow-blue); }

  /* ─── METRIC BUNCHES ─── */
  .bunch { display:none; animation:fadeUp .3s ease forwards; }
  .bunch.active { display:block; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .bunch-grid {
    display:flex; flex-wrap:nowrap; overflow-x:auto; gap:1.25rem;
    padding-bottom:1rem; /* Space for scrollbar */
    scrollbar-width:thin; scrollbar-color:rgba(26,115,232,.35) rgba(0,0,0,0.03);
  }
  .bunch-grid::-webkit-scrollbar { height:8px; display:block; }
  .bunch-grid::-webkit-scrollbar-track { background:rgba(0,0,0,0.03); border-radius:10px; }
  [data-theme="dark"] .bunch-grid::-webkit-scrollbar-track { background:rgba(255,255,255,0.05); }
  .bunch-grid::-webkit-scrollbar-thumb { background:rgba(26,115,232,.35); border-radius:10px; border: 2px solid transparent; background-clip: padding-box; }
  .bunch-grid::-webkit-scrollbar-thumb:hover { background-color:rgba(26,115,232,.6); }

  /* Metric Card */
  .mc {
    flex: 0 0 250px;
    background:var(--surface); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border:1.5px solid var(--border); border-radius:var(--r);
    padding:1.2rem 1.3rem; box-shadow:var(--shadow); position:relative; overflow:hidden;
    transition:all var(--tr);
  }
  .mc:hover { box-shadow:var(--shadow-md); transform:translateY(-2px); border-color:rgba(26,115,232,.3); }
  .mc-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:0.7rem; gap:8px; }
  .mc-lbl { font-size:0.76rem; font-weight:600; color:var(--text-m); line-height:1.3; }
  .mc-icon {
    width:30px; height:30px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--ib,var(--blue-soft)); color:var(--ic,var(--blue));
  }
  .mc-icon svg { width:14px; }
  .mc-val { font-family:'Plus Jakarta Sans',sans-serif; font-size:1.85rem; font-weight:800; line-height:1; letter-spacing:-0.04em; display:flex; align-items:baseline; gap:3px; }
  .mc-unit { font-size:0.95rem; font-weight:600; opacity:.55; }
  .mc-foot { font-size:0.7rem; color:var(--text-m); margin-top:6px; }

  /* Color helpers for mc */
  .c-blue{color:var(--blue)!important;} .c-green{color:var(--green)!important;} .c-red{color:var(--red)!important;} .c-amber{color:var(--amber)!important;} .c-purple{color:var(--purple)!important;}
  .b-red{--ib:var(--red-soft);--ic:var(--red)!important;} .b-green{--ib:var(--green-soft);--ic:var(--green)!important;} .b-amber{--ib:var(--amber-soft);--ic:var(--amber)!important;} .b-purple{--ib:var(--purple-soft);--ic:var(--purple)!important;}

  /* ─── CHARTS ─── */
  .chart-row { display:grid; gap:1.25rem; }
  .cr-main { grid-template-columns:2fr 1fr; }
  .cr-3 { grid-template-columns:1fr 1fr 1fr; }
  .cr-full { grid-template-columns:1fr; }

  .panel {
    background:var(--surface); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border:1.5px solid var(--border); border-radius:var(--r);
    padding:1.4rem; box-shadow:var(--shadow);
  }
  .ph { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:1.2rem; }
  .ph-left { }
  .ph-title { font-family:'Plus Jakarta Sans',sans-serif; font-size:0.95rem; font-weight:700; }
  .ph-sub { font-size:0.74rem; color:var(--text-m); margin-top:3px; }
  .ph-actions { display:flex; gap:5px; }
  .ph-seg {
    background:var(--surface2); border:1px solid var(--border); color:var(--text-m);
    border-radius:6px; padding:4px 10px; font-size:0.72rem; font-weight:600;
    cursor:pointer; transition:all var(--tr);
  }
  .ph-seg.active { background:var(--blue); border-color:var(--blue); color:#fff; }

  .canvas-wrap { position:relative; width:100%; }

  /* ─── HEATMAP ─── */
  .heatmap-grid-wrap { overflow-x:auto; }
  .hm-labels-row {
    display:grid; grid-template-columns:46px repeat(24,1fr); gap:3px; margin-bottom:4px;
  }
  .hm-h-lbl { font-size:0.6rem; color:var(--text-m); font-weight:700; text-align:center; }
  .hm-row-wrap { display:grid; grid-template-columns:46px repeat(24,1fr); gap:3px; margin-bottom:3px; align-items:center; }
  .hm-day-lbl { font-size:0.72rem; font-weight:700; color:var(--text-m); text-align:right; padding-right:10px; }
  .hm-cell {
    aspect-ratio:1.2; border-radius:3px; cursor:crosshair;
    transition:transform .1s, box-shadow .1s;
    background:rgba(0,0,0,.04);
  }
  [data-theme="dark"] .hm-cell { background:rgba(255,255,255,.03); }
  .hm-cell:hover { transform:scale(1.6); z-index:10; position:relative; box-shadow:0 0 10px rgba(251,188,4,.5); }
  .hm-tip {
    position:fixed; z-index:9999; background:var(--text); color:var(--surface);
    border-radius:8px; padding:8px 12px; font-size:0.76rem; font-weight:700;
    pointer-events:none; display:none; white-space:nowrap; box-shadow:var(--shadow-md);
  }

  /* ─── TOP 10 DISPOSITIONS TABLE ─── */
  .top-10-row { display:flex; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); gap:10px; }
  .top-10-row:last-child { border-bottom:none; }
  .top-10-rank { width:22px; height:22px; border-radius:6px; background:var(--blue-soft); color:var(--blue); font-size:0.72rem; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .top-10-rank.gold { background:rgba(251,188,4,.15); color:var(--amber); }
  .top-10-name { flex:1; font-size:0.82rem; font-weight:600; color:var(--text2); }
  .top-10-bar-wrap { width:120px; height:6px; background:var(--surface2); border-radius:99px; overflow:hidden; }
  .top-10-bar { height:100%; border-radius:99px; background:var(--blue); transition:width .5s ease; }
  .top-10-count { font-family:'Plus Jakarta Sans',sans-serif; font-size:0.85rem; font-weight:800; color:var(--text); min-width:36px; text-align:right; }
  .top-10-pct { font-size:0.72rem; color:var(--text-m); font-weight:600; min-width:38px; text-align:right; }

  /* Disposition toggle button */
  .disp-toggle-btn {
    background:var(--yellow-soft); color:var(--amber); border:1px solid rgba(217,119,6,.25);
    border-radius:8px; padding:6px 14px; font-size:0.75rem; font-weight:700;
    cursor:pointer; transition:all .2s; white-space:nowrap; font-family:inherit;
  }
  .disp-toggle-btn:hover { filter:brightness(1.08); }

  /* Scrollable disposition container */
  .disp-list-wrap {
    max-height:480px; overflow-y:auto; padding-right:4px;
    scrollbar-width:thin; scrollbar-color:rgba(26,115,232,.25) transparent;
  }
  .disp-list-wrap::-webkit-scrollbar { width:4px; }
  .disp-list-wrap::-webkit-scrollbar-thumb { background:rgba(26,115,232,.25); border-radius:4px; }

  /* Legend */
  .legend { display:flex; gap:1rem; flex-wrap:wrap; align-items:center; }
  .lg-item { display:flex; align-items:center; gap:5px; font-size:0.74rem; color:var(--text-m); font-weight:500; }
  .lg-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .lg-line { width:16px; height:2px; border-radius:2px; flex-shrink:0; }

  /* Utility */
  @media(max-width:1440px) {
    .hdr { padding: 0 1rem; gap: 0.5rem; }
    .hdr-datewrap input { width: 90px; font-size: 0.75rem; }
    .hdr-vbtn { padding: 4px 10px; font-size: 0.75rem; }
    .hdr-vbtns { gap: 2px; }
    .hdr-logo { gap: 8px; }
    .hdr-brand-wrap { transform: scale(0.9); transform-origin: left center; }
  }
  @media(max-width:1280px) { 
    .hero-row{grid-template-columns:repeat(2,1fr);} 
    .cr-main{grid-template-columns:1fr;} 
    .cr-3{grid-template-columns:1fr 1fr;} 
  }
  @media(max-width:1100px) {
    .hdr { flex-wrap: wrap; height: auto; min-height: 72px; padding: 12px 1rem; }
    .hdr-fill { display: none; }
    .hdr-logo { margin-right: auto; }
    .hdr-datewrap, .hdr-vbtns { order: 3; margin-top: 8px; }
    .hdr-vbtns { overflow-x: auto; max-width: 100%; scrollbar-width: none; }
    .hdr-vbtns::-webkit-scrollbar { display: none; }
  }
  @media(max-width:900px) { 
    .cr-3{grid-template-columns:1fr;} 
    .sidebar{display:none;} 
  }
  
  </style>
</head>
<body>
  <div class="hdr">
    <a href="#" class="hdr-logo">
      <div class="hdr-lm">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFEA20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
      </div>
      <div class="hdr-brand-wrap">
        <div class="hdr-ln">FreshBus</div>
        <div class="hdr-sub">Redbus Analytics</div>
      </div>
    </a>
  </div>

  <div class="app-body">
    <div class="sidebar">
      <div class="sb-sec">Filters</div>
      <div class="sb-fg">
        <label>Date Range</label>
        <input type="text" id="datePicker" placeholder="Select dates...">
      </div>
      <div class="sb-fg">
        <label>Route</label>
        <select id="routeFilter">
            <option value="all">All Routes</option>
        </select>
      </div>
      <button class="sb-btn sb-btn-primary" id="goBtn" style="margin-top: 10px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
        Sync & Update
      </button>
    </div>

    <div class="app-main">
      <div class="pg-head">
        <div>
          <h1>Redbus Dashboard</h1>
          <p>KPIs and Route-wise Analytics for Redbus</p>
        </div>
      </div>

      <div class="hero-row" id="kpiContainer">
        <!-- Cards injected by JS -->
      </div>

      <div style="display:flex; gap:1.5rem; flex-wrap:wrap;">
        <div class="hero-card" style="flex:1; min-width:300px; padding:1.5rem;">
          <div class="hc-lbl">Route-wise Performance</div>
          <table style="width:100%; border-collapse:collapse; margin-top:10px; font-size:0.85rem;" id="routeTable">
            <thead>
              <tr style="border-bottom:1px solid var(--border); text-align:left;">
                <th style="padding:8px;">Route</th>
                <th style="padding:8px;">Travel Count</th>
                <th style="padding:8px;">Rating Count</th>
                <th style="padding:8px;">Avg Rating</th>
                <th style="padding:8px;">Response Rate</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="hero-card" style="flex:1; min-width:300px; padding:1.5rem;">
          <div class="hc-lbl">TL Performance</div>
          <table style="width:100%; border-collapse:collapse; margin-top:10px; font-size:0.85rem;" id="tlTable">
            <thead>
              <tr style="border-bottom:1px solid var(--border); text-align:left;">
                <th style="padding:8px;">TL Name</th>
                <th style="padding:8px;">Count</th>
                <th style="padding:8px;">Avg Rating</th>
                <th style="padding:8px;">Response Rate</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    flatpickr("#datePicker", { mode: "range", dateFormat: "Y-m-d" });

    function createCard(title, value) {
        return `
            <div class="hero-card" style="--accent:var(--blue);">
                <div class="hc-top">
                    <div class="hc-lbl">${title}</div>
                </div>
                <div class="hc-val">${value}</div>
            </div>
        `;
    }

    async function loadData() {
        try {
            const res = await fetch('/api/redbus/metrics');
            const result = await res.json();
            if(result.status === 'success') {
                const data = result.data;
                const container = document.getElementById('kpiContainer');
                container.innerHTML = '';
                
                // Cards
                for (const [key, val] of Object.entries(data.cards)) {
                    container.innerHTML += createCard(key, val);
                }

                // Routes Table
                const routeTbody = document.querySelector('#routeTable tbody');
                routeTbody.innerHTML = '';
                data.routes.forEach(r => {
                    routeTbody.innerHTML += `
                        <tr style="border-bottom:1px solid var(--border);">
                            <td style="padding:8px; font-weight:600;">${r.route}</td>
                            <td style="padding:8px;">${r.travel_count}</td>
                            <td style="padding:8px;">${r.rating_count}</td>
                            <td style="padding:8px; color:var(--green); font-weight:700;">${r.avg_rating}</td>
                            <td style="padding:8px; color:var(--blue); font-weight:700;">${r.response_rate}</td>
                        </tr>
                    `;
                });

                // TL Table
                const tlTbody = document.querySelector('#tlTable tbody');
                tlTbody.innerHTML = '';
                data.tls.forEach(t => {
                    tlTbody.innerHTML += `
                        <tr style="border-bottom:1px solid var(--border);">
                            <td style="padding:8px; font-weight:600;">${t.tl}</td>
                            <td style="padding:8px;">${t.count}</td>
                            <td style="padding:8px; color:var(--green); font-weight:700;">${t.avg}</td>
                            <td style="padding:8px; color:var(--blue); font-weight:700;">${t.response_rate}</td>
                        </tr>
                    `;
                });
            }
        } catch(e) {
            console.error('Error loading data', e);
        }
    }

    document.getElementById('goBtn').addEventListener('click', loadData);
    
    // Initial load
    loadData();
  </script>
</body>
</html>
